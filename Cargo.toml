[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/banking",
    "crates/investing",
    "crates/health",
    "crates/analytics",
    "crates/cli",
    "crates/gui",
]

# Versions live here so the crates cannot drift apart.
[workspace.dependencies]
anyhow    = "1"
chrono    = { version = "0.4", features = ["serde"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx      = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "sqlite", "migrate", "macros", "chrono",
] }
tokio     = { version = "1", features = ["macros", "rt-multi-thread"] }
csv       = "1"
dotenvy   = "0.15"
reqwest   = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[workspace.package]
edition = "2021"
version = "0.1.0"

# The GUI is the only thing that benefits from optimisation during
# development; everything else is I/O bound against a local SQLite file.
[profile.dev.package."*"]
opt-level = 2
